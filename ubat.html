<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MEDICARE - Medicine List</title>
    <link rel="stylesheet" href="ubat.css">
</head>
<body>
    <div class="leaf-bg">
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
        <div class="leaf leaf-4"></div>
        <div class="leaf leaf-5"></div>
        <div class="leaf leaf-6"></div>
        <div class="leaf leaf-7"></div>
        <div class="leaf leaf-8"></div>
        <div class="leaf leaf-9"></div>
        <div class="leaf leaf-10"></div>
        <div class="leaf leaf-11"></div>
        <div class="leaf leaf-12"></div>
    </div>

    <div class="main-container">
        <div class="header">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <h1>💊 Medicine List</h1>
            <div></div>
        </div>

        <button class="btn-add" onclick="showAddMedicineModal()">+ Add New Medicine</button>

        <div class="medicine-container">
            <h2>Your Medicine Schedule</h2>
            <div id="medicineList" class="medicine-list"></div>
        </div>

        <div class="info-box">
            <p>💡 <strong>Tip:</strong> Click on medicine to edit time. Notifications will appear based on the schedule.</p>
        </div>
    </div>

    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ Add New Medicine</h3>
                <span class="close-modal" onclick="closeModal('addModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Medicine Name</label>
                    <input type="text" id="medName" placeholder="e.g: Vitamin C">
                </div>
                <div class="input-group">
                    <label>Dosage</label>
                    <input type="text" id="medDose" placeholder="e.g: 2x daily">
                </div>
                <div class="input-group">
                    <label>Time (HH:MM)</label>
                    <input type="time" id="medTime" value="08:00">
                    <small>Notification will appear at this time</small>
                </div>
                <button class="btn-save" onclick="addMedicine()">💾 Save Medicine</button>
            </div>
        </div>
    </div>

    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Edit Medicine</h3>
                <span class="close-modal" onclick="closeModal('editModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Medicine Name</label>
                    <input type="text" id="editMedName">
                </div>
                <div class="input-group">
                    <label>Dosage</label>
                    <input type="text" id="editMedDose">
                </div>
                <div class="input-group">
                    <label>Time (HH:MM)</label>
                    <input type="time" id="editMedTime">
                    <small>Notification will appear at this time</small>
                </div>
                <div class="modal-buttons">
                    <button class="btn-delete" onclick="deleteMedicine()">🗑️ Delete</button>
                    <button class="btn-save" onclick="saveEditMedicine()">💾 Save</button>
                </div>
            </div>
        </div>
    </div>

    <script src="ubat.js"></script>
    <script src="darkmodeall.js"></script>
</body>
</html>
