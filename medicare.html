<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MEDICARE - Natural Health Platform</title>
    <link rel="stylesheet" href="medicare.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <!-- Background natural leaves pattern -->
    <div class="leaf-bg">
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
        <div class="leaf leaf-4"></div>
        <div class="leaf leaf-5"></div>
        <div class="leaf leaf-6"></div>
        <div class="leaf leaf-7"></div>
        <div class="leaf leaf-8"></div>
        <div class="leaf leaf-9"></div>
        <div class="leaf leaf-10"></div>
        <div class="leaf leaf-11"></div>
        <div class="leaf leaf-12"></div>
    </div>

    <div class="web-wrapper">
        <!-- Page 1: Logo Animation + Get Started -->
        <div id="splashPage" class="page active">
            <div class="content-card">
                <div class="logo-area">
                    <img src="ubat.png" alt="MEDICARE" class="medicare-logo" id="logoImg">
                    <h1 class="app-title">MEDICARE</h1>
                    <p class="tagline">💗 Keep your health happy and heart healthy 💗</p>
                </div>
                <button id="getStartedBtn" class="btn btn-primary">✦ Get Started ✦</button>
            </div>
        </div>

        <!-- Page 2: Sign In -->
        <div id="choicePage" class="page">
            <div class="content-card">
                <div class="choice-header">
                    <img src="ubat.png" alt="logo" class="small-logo">
                    <h2>Welcome to MEDICARE</h2>
                    <p>🌺 Your health journey, our passion 🌺</p>
                </div>
                <div class="choice-buttons">
                    <button id="signInBtn" class="btn btn-primary">📝 Sign In</button>
                </div>
            </div>
        </div>
    </div>

    <script src="medicare.js"></script>
</body>
</html>
