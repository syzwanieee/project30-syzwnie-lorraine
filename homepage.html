<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MEDICARE - Home</title>
    <link rel="stylesheet" href="homepage.css">
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
</head>
<body>
    <div class="leaf-bg">
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
        <div class="leaf leaf-4"></div>
        <div class="leaf leaf-5"></div>
        <div class="leaf leaf-6"></div>
        <div class="leaf leaf-7"></div>
        <div class="leaf leaf-8"></div>
        <div class="leaf leaf-9"></div>
        <div class="leaf leaf-10"></div>
        <div class="leaf leaf-11"></div>
        <div class="leaf leaf-12"></div>
    </div>

    <div class="main-container">
        <!-- Top Bar -->
        <div class="top-bar">
            <div class="greeting-container">
                <h2 class="greeting-text" id="greetingText">Good Morning</h2>
            </div>
            <div class="profile-icon" id="profileIcon">
                <img src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 24 24' fill='%236aa85f'%3E%3Cpath d='M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z'/%3E%3C/svg%3E" alt="Profile" class="profile-img" id="profileImg">
                <span class="profile-badge"></span>
            </div>
        </div>

        <!-- Welcome Section -->
        <div class="welcome-section">
            <div class="welcome-animation">
                <h1 class="welcome-title slide-down" id="welcomeTitle">Welcome, <span id="userNameWelcome">Guest</span>!</h1>
                <p class="welcome-subtitle slide-down-delay" id="welcomeSubtitle">Your health journey starts here 🌿</p>
            </div>
        </div>

        <!-- Dashboard Cards -->
        <div class="dashboard-cards">
            <div class="card card-1" data-feature="health">
                <div class="card-icon">📋</div>
                <div class="card-text" id="healthRecordsText">Health Records</div>
            </div>
            <!-- Card 2: Music Therapy (bukan Medicine Reminder) -->
            <div class="card card-2" data-feature="music">
                <div class="card-icon">🎵</div>
                <div class="card-text" id="musicTherapyText">Music Therapy</div>
            </div>
            <div class="card card-3" data-feature="reminder">
                <div class="card-icon">😴</div>
                <div class="card-text" id="sleepReminderText">Sleep Reminder</div>
            </div>
            <div class="card card-4" data-feature="appointment">
                <div class="card-icon">📅</div>
                <div class="card-text" id="appointmentsText">Appointments</div>
            </div>
        </div>

        <!-- Recent Activities -->
        <div class="recent-section">
            <h3 id="recentTitle">Recent Activities</h3>
            <div class="activity-list">
                <div class="activity-item">
                    <span class="activity-icon">💊</span>
                    <span class="activity-text" id="activity1Text">Vitamin C taken at 8:00 AM</span>
                </div>
                <div class="activity-item">
                    <span class="activity-icon">🏃</span>
                    <span class="activity-text" id="activity2Text">Morning walk completed</span>
                </div>
                <div class="activity-item">
                    <span class="activity-icon">🍎</span>
                    <span class="activity-text" id="activity3Text">Healthy breakfast logged</span>
                </div>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="bottom-nav">
        <div class="nav-item active" data-page="home">
            <div class="nav-icon">🏠</div>
            <div class="nav-label" id="navHomeLabel">Home</div>
        </div>
        <div class="nav-item" data-page="medicine">
            <div class="nav-icon">💊</div>
            <div class="nav-label" id="navMedicineLabel">Medicine List</div>
        </div>
        <div class="nav-item" data-page="location">
            <div class="nav-icon">📍</div>
            <div class="nav-label" id="navLocationLabel">Nearby Hospital</div>
        </div>
        <div class="nav-item" data-page="setting">
            <div class="nav-icon">⚙️</div>
            <div class="nav-label" id="navSettingLabel">Settings</div>
        </div>
    </div>

    <script src="homepage.js"></script>
    <script src="darkmodeall.js"></script>
</body>
</html>
