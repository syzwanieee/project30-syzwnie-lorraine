<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=yes">
    <title>MEDICARE - Appointments</title>
    <link rel="stylesheet" href="appointment.css">
</head>
<body>
    <div class="leaf-bg">
        <div class="leaf leaf-1"></div>
        <div class="leaf leaf-2"></div>
        <div class="leaf leaf-3"></div>
        <div class="leaf leaf-4"></div>
        <div class="leaf leaf-5"></div>
        <div class="leaf leaf-6"></div>
        <div class="leaf leaf-7"></div>
        <div class="leaf leaf-8"></div>
        <div class="leaf leaf-9"></div>
        <div class="leaf leaf-10"></div>
        <div class="leaf leaf-11"></div>
        <div class="leaf leaf-12"></div>
    </div>

    <div class="main-container">
        <!-- Header -->
        <div class="header">
            <button class="back-btn" onclick="goBack()">← Back</button>
            <h1>📅 Appointments</h1>
            <div></div>
        </div>

        <!-- Add Appointment Button -->
        <button class="btn-add" onclick="showAddAppointmentModal()">+ New Appointment</button>

        <!-- Upcoming Appointments -->
        <div class="appointment-container">
            <h2>Upcoming Appointments</h2>
            <div id="upcomingList" class="appointment-list">
                <!-- Upcoming appointments will be loaded here -->
            </div>
        </div>

        <!-- Past Appointments -->
        <div class="appointment-container past">
            <h2>Past Appointments</h2>
            <div id="pastList" class="appointment-list">
                <!-- Past appointments will be loaded here -->
            </div>
        </div>

        <!-- Info Box -->
        <div class="info-box">
            <p>💡 <strong>Tip:</strong> Click on appointment to edit or cancel. Add your medical appointments to never miss them!</p>
        </div>
    </div>

    <!-- Add Appointment Modal -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>➕ New Appointment</h3>
                <span class="close-modal" onclick="closeModal('addModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Hospital/Clinic Name</label>
                    <input type="text" id="appName" placeholder="e.g: Hospital Kuala Lumpur">
                </div>
                <div class="input-group">
                    <label>Doctor Name</label>
                    <input type="text" id="doctorName" placeholder="e.g: Dr. Ahmad">
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="appDate">
                </div>
                <div class="input-group">
                    <label>Time</label>
                    <input type="time" id="appTime">
                </div>
                <div class="input-group">
                    <label>Notes (Optional)</label>
                    <textarea id="appNotes" rows="2" placeholder="e.g: Bring lab results"></textarea>
                </div>
                <button class="btn-save" onclick="addAppointment()">💾 Save Appointment</button>
            </div>
        </div>
    </div>

    <!-- Edit Appointment Modal -->
    <div id="editModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>✏️ Edit Appointment</h3>
                <span class="close-modal" onclick="closeModal('editModal')">&times;</span>
            </div>
            <div class="modal-body">
                <div class="input-group">
                    <label>Hospital/Clinic Name</label>
                    <input type="text" id="editAppName">
                </div>
                <div class="input-group">
                    <label>Doctor Name</label>
                    <input type="text" id="editDoctorName">
                </div>
                <div class="input-group">
                    <label>Date</label>
                    <input type="date" id="editAppDate">
                </div>
                <div class="input-group">
                    <label>Time</label>
                    <input type="time" id="editAppTime">
                </div>
                <div class="input-group">
                    <label>Notes</label>
                    <textarea id="editAppNotes" rows="2"></textarea>
                </div>
                <div class="modal-buttons">
                    <button class="btn-delete" onclick="deleteAppointment()">🗑️ Cancel Appointment</button>
                    <button class="btn-save" onclick="saveEditAppointment()">💾 Save Changes</button>
                </div>
            </div>
        </div>
    </div>

    <script src="appointment.js"></script>
    <script src="darkmodeall.js"></script>
</body>
</html>
